# Read by gameimport (~/Projects/gameimport/cmd/gameimport, shipped beside cotab): it asks
# for the game and copies its files into data/, where cotab looks by default.
game = "Curse of the Azure Bonds"

[[source]]
name     = "Curse of the Azure Bonds (1989)"
describe = "The SSI DOS release: the game folder, its disks or the GOG installer"
markers  = ["BIGPIC1.DAX", "SKY.DAX", "WILDCOM.DAX"] # Pool of Radiance has no BIGPIC/SKY, Secret of the Silver Blades no WILDCOM
files    = ["*.DAX", "ITEMS", "CURSE.CFG", "START.EXE", "GAME.OVR", "SAVE/*"]
dest     = "data"
upper    = true

[[source]]
name     = "the Amiga disks"
optional = true
describe = "The Amiga release's .adf disk images (loose or zipped). F12 then switches to the Amiga graphics."
markers  = ["*.ADF"]
files    = ["*.ADF"]
dest     = "ADF"
run      = ["./cotab", "-import-disk2", "ADF", "-data", "data"]
