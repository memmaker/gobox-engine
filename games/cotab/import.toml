# Read by gameimport (~/Projects/gameimport/cmd/gameimport): `gameimport games/cotab/import.toml`.
# Paths are relative to this file. It copies the originals into data/cotab/sources/ and runs
# `gobox import`, which writes the adventure folder data/cotab (and its COVER.PNG).
game = "Curse of the Azure Bonds"

[[source]]
name     = "Curse of the Azure Bonds (1989)"
describe = "The SSI DOS release: the game folder, its disks or the GOG installer"
markers  = ["BIGPIC1.DAX", "SKY.DAX", "WILDCOM.DAX"] # Pool of Radiance has no BIGPIC/SKY, Secret of the Silver Blades no WILDCOM
files    = ["*.DAX", "ITEMS", "CURSE.CFG", "START.EXE", "GAME.OVR", "SAVE/*"]
dest     = "../../data/cotab/sources/dos"
upper    = true
run      = ["../../gobox", "import", "-out", "../../data", "cotab", "../../data/cotab/sources/dos"] # the adventure folder data/cotab

[[source]]
name     = "the Amiga disks"
optional = true
describe = "The Amiga release's .adf disk images (loose or zipped). F12 then switches to the Amiga graphics."
markers  = ["*.ADF"]
files    = ["*.ADF"]
dest     = "../../data/cotab/sources/adf"
run      = ["../../gobox", "import", "-out", "../../data", "-amiga", "cotab", "../../data/cotab/sources/adf"] # into sources/amiga, then the DOS import again
