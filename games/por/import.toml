# Read by gameimport (~/Projects/gameimport/cmd/gameimport): `gameimport games/por/import.toml`.
# Paths are relative to this file. It copies the originals into data/por/sources/ and runs
# `gobox import`, which writes the adventure folder data/por (and its COVER.PNG).
game = "Pool of Radiance"

[[source]]
name     = "Pool of Radiance (1988)"
describe = "The SSI DOS release"
markers  = ["TITLE.DAX", "8X8D1.DAX"]
exclude  = ["SKY.DAX", "BIGPIC1.DAX"] # Curse of the Azure Bonds
files    = ["*.DAX", "POOL.CFG", "ITEMS", "START.EXE"] # START.EXE: the sound tables, decoded at import
dest     = "../../data/por/sources/dos"
upper    = true
run      = ["../../gobox", "import", "-out", "../../data", "por", "../../data/por/sources/dos"] # the adventure folder data/por

[[source]]
name     = "the Amiga disks"
optional = true
describe = "The Amiga release's .adf disk images (loose or zipped). opool then shows the Amiga graphics and plays its sound."
markers  = ["*.ADF"]
files    = ["*.ADF"]
dest     = "../../data/por/sources/adf"
run      = ["../../gobox", "import", "-out", "../../data", "-amiga", "por", "../../data/por/sources/adf"] # into sources/amiga, then the DOS import again

[[source]]
name     = "the voice-over"
optional = true
describe = "por-voice.zip, the spoken story lines (.ogg)."
markers  = ["1a83648acff21ee4.ogg", "1ae1390bbc88f267.ogg"]
files    = ["*.ogg"]
dest     = "../../data/por/sources/assets/speech"
